[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "nut"
version = "2026.10"
dependencies = [
  "click",
  "gitpython",
  "paramiko",
  "pyyaml",
]
requires-python = ">=3.8"
authors = [
  { name = "Thierry Reding", email = "thierry.reding@kernel.org" }
]
description = "(Linux-)Next Utility Toolkit"
readme = "README.md"
license = "MIT"
license-files = [ "LICEN[CS]E.*" ]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
nut = "nut.cli:main"
